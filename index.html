<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0c">
<title>Sleep tools</title>
<link rel="icon" href="nights/icon-192.png">
<style>
:root { color-scheme: dark; --page: #0a0b0c; --surface: #131517; --ink: #f4f6f7; --ink-2: #c4c8cc; --muted: #8b9096; --border: rgba(255,255,255,0.08); --accent: #2bff88; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 16px 48px; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
a.app { display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px; margin-bottom: 10px; }
a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.app img { width: 52px; height: 52px; border-radius: 12px; flex: none; }
a.app b { display: block; font-size: 16px; }
a.app span { display: block; font-size: 14px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
p { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Sleep tools</h1>
  <a class="app" href="nights/"><img src="nights/icon-192.png" alt=""><div><b>Nights</b><span>One-tap morning check-in and a streak for the nights you tried.</span></div></a>
  <a class="app" href="pvt/"><img src="pvt/icon-192.png" alt=""><div><b>PVT</b><span>Psychomotor vigilance test for tracking sleep debt against yourself.</span></div></a>
  <p>Open one, then Chrome menu (⋮) → Install app. Each installs as its own app. Data stays on the phone.</p>
</main>
</body>
</html>
